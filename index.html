<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache">
<title>테슬라 내비</title>
<style>
:root{--bg:#111214;--panel:rgba(22,23,26,.94);--panel2:#2a2b30;--fg:#f4f4f5;--dim:#a1a1aa;--acc:#1a73e8;--ok:#34c759;--warn:#ffcc00;--err:#ff453a;--line:#3a3b40}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:var(--fg)}
#map{position:absolute;inset:0;touch-action:none}  /* 브라우저가 터치 끌기를 스크롤로 가져가지 않게 */
.hidden{display:none!important}

/* 상단 회전 안내 */
#banner{position:absolute;top:12px;left:12px;z-index:5;display:flex;align-items:center;gap:18px;
  background:var(--acc);border-radius:18px;padding:14px 26px 14px 18px;min-width:420px;max-width:calc(100% - 24px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
#turnIcon{width:84px;height:84px;flex:none}
#turnIcon svg{width:84px;height:84px}
.btn svg{width:30px;height:30px;flex:none}
.btn.ic{padding:0;width:72px;justify-content:center}
.lbl{white-space:nowrap}
/* 좁은 화면: 목적지·재탐색은 아이콘만 (하단 줄이 넘치지 않게) */
@media (max-width:1020px){#btnSearch,#btnReroute{padding:0;width:72px;justify-content:center}#btnSearch .lbl,#btnReroute .lbl{display:none}}
#turnDist{font-size:52px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
#turnText{font-size:26px;font-weight:600;margin-top:4px}
#thenText{font-size:18px;opacity:.85;margin-top:4px}

/* 하단 정보/버튼 */
#bottom{position:absolute;left:12px;right:96px;bottom:12px;z-index:5;display:flex;gap:10px;align-items:stretch;flex-wrap:nowrap;pointer-events:none}
#bottom>*{pointer-events:auto;flex:none}
/* 오른쪽 세로 버튼 (확대/축소/현위치/음성/설정) */
#side{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:10px}
#info{background:var(--panel);border-radius:16px;padding:10px 18px;white-space:nowrap;display:flex;gap:22px;align-items:center;font-variant-numeric:tabular-nums}
#info b{font-size:32px}
#info span{font-size:18px;color:var(--dim)}
.btn{background:var(--panel);border:0;border-radius:16px;padding:0 22px;min-height:72px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
.btn.pri{background:var(--acc)}
.btn.danger{background:#5a1d1d}
.spacer{flex:1}

/* 패널 (검색/설정) */
.sheet{position:absolute;top:12px;left:12px;bottom:12px;width:min(560px,calc(100% - 24px));z-index:10;background:var(--panel);
  border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.sheet h2{margin:0;font-size:24px}
.row{display:flex;gap:10px;align-items:center}
.inp{flex:1;min-width:0;font-size:24px;padding:16px;border-radius:12px;border:1px solid var(--line);background:#0c0c0e;color:var(--fg)}
.list{overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1}
.item{text-align:left;background:var(--panel2);border:0;border-radius:12px;padding:14px 16px;font-size:22px;width:100%}
.item small{display:block;color:var(--dim);font-size:16px;margin-top:4px}
.sec{color:var(--dim);font-size:16px;margin-top:4px}
.note{color:var(--dim);font-size:15px;line-height:1.5}

#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;z-index:20;background:rgba(0,0,0,.85);color:#fff;
  padding:14px 22px;border-radius:14px;font-size:20px;max-width:80%;text-align:center}
#gpsState{position:absolute;top:12px;right:12px;z-index:5;background:var(--panel);border-radius:12px;padding:8px 12px;font-size:15px;color:var(--dim)}

/* 내 위치 마커 */
.me{width:44px;height:44px;position:relative}
.me svg{width:44px;height:44px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));transition:transform .3s linear}
</style>
</head>
<body>
<div id="map"></div>

<div id="banner" class="hidden">
  <div id="turnIcon"></div>
  <div><div id="turnDist">—</div><div id="turnText"></div><div id="thenText"></div></div>
</div>
<div id="gpsState">위치 수신 대기</div>


<div id="bottom">
  <div id="info" class="hidden"><div><b id="remain">—</b> <span>남음</span></div><div><b id="eta">—</b> <span id="etaDur"></span></div></div>
  <button class="btn pri" id="btnSearch" data-ic="search" aria-label="목적지"><span class="lbl">목적지</span></button>
  <button class="btn hidden" id="btnReroute" data-ic="reroute" aria-label="재탐색"><span class="lbl">재탐색</span></button>
  <button class="btn danger hidden" id="btnStop" data-ic="close" aria-label="안내 종료"><span class="lbl">안내 종료</span></button>
</div>
<div id="side">
  <button class="btn ic" id="zoomIn" data-ic="plus" aria-label="확대"></button>
  <button class="btn ic" id="zoomOut" data-ic="minus" aria-label="축소"></button>
  <button class="btn ic pri hidden" id="recenter" data-ic="locate" aria-label="현위치"></button>
  <button class="btn ic" id="btnVoice" aria-label="음성"></button>
  <button class="btn ic" id="btnSettings" data-ic="gear" aria-label="설정"></button>
</div>

<div class="sheet hidden" id="searchSheet">
  <div class="row"><h2>목적지 검색</h2><div class="spacer"></div><button class="btn" id="searchClose" style="min-height:52px">닫기</button></div>
  <form class="row" id="searchForm"><input class="inp" id="q" placeholder="장소, 주소 검색" autocomplete="off"><button class="btn pri" style="min-height:60px">검색</button></form>
  <div class="list" id="results"></div>
</div>

<div class="sheet hidden" id="settingsSheet">
  <div class="row"><h2>설정</h2><div class="spacer"></div><button class="btn" id="settingsClose" style="min-height:52px">닫기</button></div>
  <div class="sec">카카오 REST API 키 (길찾기용, 이 브라우저에만 저장)</div>
  <div class="row"><input class="inp" id="restKey" placeholder="REST API 키" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn pri" id="saveKey" style="min-height:60px">저장</button></div>
  <div class="note" id="keyState"></div>
  <div class="row"><button class="btn" id="voiceTest" style="min-height:60px">음성 테스트</button><button class="btn" id="clearRecent" style="min-height:60px">최근 목적지 지우기</button></div>
  <div class="note">
    · 현재 위치는 길찾기·검색을 위해 카카오로만 전달되고, 다른 서버로 보내지 않습니다.<br>
    · 오늘 길찾기 호출: <b id="callCount">0</b>회 (무료 한도 하루 10,000회)<br>
    · 지도 터치 수신 (분석용): <span id="evInfo">-</span><br>
    · 버전 <span id="ver"></span> · <a href="phase0/" style="color:#8ab4f8">위치 측정 페이지(Phase 0)</a>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
// 카카오 지도 SDK 로드 실패 감지
window.__sdkError = false;
</script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a53568cf2b599d80652c79eba7b6a5ca&libraries=services&autoload=false" onerror="window.__sdkError=true"></script>
<script type="module">
import * as N from './nav-core.js';

const VERSION = 'p1-2026-11-17.4';
const DIRECTIONS_URL = 'https://apis-navi.kakaomobility.com/v1/directions';
const $ = id => document.getElementById(id);

// ---------- 아이콘 (SVG) ----------
// 테슬라 브라우저 글꼴에 화살표·특수기호 글자가 없어 X 박스로 나옴 (2026-11-17 실차) -> 글자 대신 SVG로 그림
const S = 'fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  // 회전 안내 (흰색, 굵게)
  straight:  '<path d="M12 21V4M6 10l6-6 6 6"/>',
  left:      '<path d="M16 21v-8a4 4 0 0 0-4-4H5M9 5L5 9l4 4"/>',
  right:     '<path d="M8 21v-8a4 4 0 0 1 4-4h7M15 5l4 4-4 4"/>',
  keepLeft:  '<path d="M15 21v-6L7 7M7 13V7h6"/>',
  keepRight: '<path d="M9 21v-6l8-8M11 7h6v6"/>',
  uturn:     '<path d="M15 21V9a5 5 0 0 0-10 0v6M2 12l3 3 3-3"/>',
  arrive:    '<path d="M6 21V4M6 4h11l-2 4 2 4H6"/>',
  via:       '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/>',
  // 버튼
  search:  '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>',
  reroute: '<path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/>',
  close:   '<path d="M6 6l12 12M18 6L6 18"/>',
  plus:    '<path d="M12 5v14M5 12h14"/>',
  minus:   '<path d="M5 12h14"/>',
  locate:  '<circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
  gear:    '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  voiceOn: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
  voiceOff:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'
};
const icon = name => '<svg viewBox="0 0 24 24" ' + S + '>' + (ICONS[name] || ICONS.straight) + '</svg>';
document.querySelectorAll('[data-ic]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.ic)));
$('ver').textContent = VERSION;

const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- 상태 ----------
let map, meOverlay, meEl, routeLine, destMarker;
let pos = null, lastHeading = 0, follow = true;
let route = null, dest = null, segHint = 0, navigating = false, routing = false;
let voiceOn = ls.get('nav.voice', true);
const monitor = N.createRerouteMonitor({ threshold: 50, holdMs: 5000, cooldownMs: 20000 });
let announcer = N.createAnnouncer([500, 200, 50]);

// REST 키: URL #rk=... 로도 설정 가능 (북마크용, 서버로 전송되지 않는 fragment)
const hashKey = new URLSearchParams(location.hash.slice(1)).get('rk');
if (hashKey) ls.set('nav.restKey', hashKey);
const restKey = () => ls.get('nav.restKey', '');

function toast(msg, ms = 3000) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.add('hidden'), ms);
}
function show(id, on) { $(id).classList.toggle('hidden', !on); }

// ---------- 음성 ----------
function speak(text) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 1.05;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function paintVoice() { $('btnVoice').innerHTML = icon(voiceOn ? 'voiceOn' : 'voiceOff'); }
$('btnVoice').onclick = () => { voiceOn = !voiceOn; ls.set('nav.voice', voiceOn); paintVoice(); if (voiceOn) speak('음성 안내를 켭니다'); };
$('voiceTest').onclick = () => {
  if (!('speechSynthesis' in window)) { toast('이 브라우저는 음성 합성을 지원하지 않습니다'); return; }
  const was = voiceOn; voiceOn = true; speak('300미터 앞 우회전입니다'); voiceOn = was;
};
paintVoice();

// ---------- 지도 ----------
function initMap() {
  const center = new kakao.maps.LatLng(37.5665, 126.978);
  map = new kakao.maps.Map($('map'), { center, level: 4 });
  meEl = document.createElement('div'); meEl.className = 'me';
  meEl.innerHTML = '<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="#fff"/><circle cx="22" cy="22" r="17" fill="#1a73e8"/>' +
                   '<path d="M22 8 L31 30 L22 25 L13 30 Z" fill="#fff"/></svg>';
  meOverlay = new kakao.maps.CustomOverlay({ content: meEl, position: center, xAnchor: 0.5, yAnchor: 0.5, zIndex: 10 });
  // 카카오 기본 끌기·확대는 끄고 앱이 직접 처리 (아래 '지도 조작' 참고)
  map.setDraggable(false); map.setZoomable(false);
  gestures($('map'));
  startGeo();
}
function setFollow(on) {
  follow = on; show('recenter', !on);
  if (on && pos) map.setCenter(new kakao.maps.LatLng(pos.lat, pos.lng));
}
$('recenter').onclick = () => setFollow(true);

// ---------- 지도 조작 (끌기·두 손가락 확대) ----------
// 2026-11-17 실차(v1.3): 테슬라 브라우저에서 터치 끌기·핀치가 모두 안 됨.
// 추정 원인: 테슬라 브라우저가 데스크톱으로 인식돼 카카오 지도가 마우스 조작만 받고,
// 터치 끌기는 브라우저가 스크롤 동작으로 가져감. -> 카카오 기본 조작을 끄고 포인터/터치 이벤트로 직접 처리.
// 손가락이 닿아 있는 동안과 뗀 뒤 1.5초는 따라가기 자동 이동을 멈춤.
let touching = 0, lastTouch = 0;
const evCount = { pointer: 0, touch: 0, mouse: 0 };   // 실차 분석용 (설정 화면에 표시)
function gestures(el) {
  const pts = new Map();          // 닿아 있는 손가락: id -> {x, y}
  let start = null;               // 시작 시점 정보 (끌기 판정·핀치 기준 거리)
  let pendDx = 0, pendDy = 0, raf = 0;
  const center2 = () => { const a = [...pts.values()]; return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) }; };
  const flush = () => {
    raf = 0;
    if (!pendDx && !pendDy) return;
    const w = el.clientWidth / 2, h = el.clientHeight / 2;
    const c = map.getProjection().coordsFromContainerPoint(new kakao.maps.Point(w - pendDx, h - pendDy));
    pendDx = pendDy = 0;
    map.setCenter(c);
  };
  const panBy = (dx, dy) => { pendDx += dx; pendDy += dy; if (!raf) raf = requestAnimationFrame(flush); };
  const reset = () => {
    start = null;
    if (pts.size === 1) { const p = [...pts.values()][0]; start = { x: p.x, y: p.y, dragging: false }; }
    if (pts.size === 2) { start = { pinch: center2().d, dragging: true }; }
  };
  function down(id, x, y) {
    pts.set(id, { x, y }); touching = pts.size; lastTouch = Date.now(); reset();
  }
  function move(id, x, y) {
    const p = pts.get(id); if (!p) return;
    lastTouch = Date.now();
    if (pts.size === 1 && start) {
      if (!start.dragging && Math.hypot(x - start.x, y - start.y) > 10) { start.dragging = true; setFollow(false); }
      if (start.dragging) panBy(x - p.x, y - p.y);
      p.x = x; p.y = y;
    } else if (pts.size === 2 && start) {
      const before = center2(); p.x = x; p.y = y; const after = center2();
      if (!follow) panBy(after.x - before.x, after.y - before.y);
      const r = after.d / start.pinch;
      if (r > 1.5 || r < 0.67) { zoomBy(r > 1 ? -1 : 1); start.pinch = after.d; }
    }
  }
  function up(id) {
    if (!pts.delete(id)) return;
    touching = pts.size; lastTouch = Date.now(); reset();
  }
  if ('PointerEvent' in window) {
    el.addEventListener('pointerdown', e => {
      evCount.pointer++; if (e.pointerType === 'mouse' && e.button !== 0) return;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      down(e.pointerId, e.clientX, e.clientY);
    });
    el.addEventListener('pointermove', e => move(e.pointerId, e.clientX, e.clientY));
    ['pointerup', 'pointercancel'].forEach(t => window.addEventListener(t, e => up(e.pointerId)));
  } else {
    const each = (e, f) => { for (const t of e.changedTouches) f(t.identifier, t.clientX, t.clientY); };
    el.addEventListener('touchstart', e => { evCount.touch++; each(e, down); }, { passive: true });
    el.addEventListener('touchmove', e => { e.preventDefault(); each(e, move); }, { passive: false });
    ['touchend', 'touchcancel'].forEach(t => window.addEventListener(t, e => each(e, up)));
  }
  el.addEventListener('touchstart', () => { if ('PointerEvent' in window) evCount.touch++; }, { passive: true });
  el.addEventListener('mousedown', () => evCount.mouse++);
  // PC 마우스 휠
  let wheelAt = 0;
  el.addEventListener('wheel', e => {
    e.preventDefault(); const now = Date.now(); if (now - wheelAt < 250) return; wheelAt = now;
    zoomBy(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });
}
function zoomBy(d) {
  lastTouch = Date.now();
  map.setLevel(Math.min(14, Math.max(1, map.getLevel() + d)));
  if (follow && pos) map.setCenter(new kakao.maps.LatLng(pos.lat, pos.lng));
}
$('zoomIn').onclick = () => zoomBy(-1);
$('zoomOut').onclick = () => zoomBy(1);

// ---------- 위치 ----------
let lastProc = 0, lastPan = 0, gotFirst = false;
function startGeo() {
  if (!('geolocation' in navigator)) { $('gpsState').textContent = '위치 기능 없음'; return; }
  navigator.geolocation.watchPosition(onPos, onGeoErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
}
function onGeoErr(e) {
  $('gpsState').textContent = '위치 오류 ' + e.code + (e.code === 1 ? ' (권한 거부)' : '');
  $('gpsState').style.color = 'var(--err)';
}
function onPos(p) {
  const c = p.coords;
  // 테슬라 브라우저의 position.timestamp는 epoch가 아니므로 수신 시각을 사용 (Phase 0 발견)
  pos = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, speed: c.speed, t: Date.now() };
  if (c.heading != null && !isNaN(c.heading) && (c.speed == null || c.speed > 0.8)) lastHeading = c.heading;
  const now = Date.now();
  if (now - lastProc < 400) return;   // 초당 7회 수준 -> 약 2회로 줄임
  lastProc = now;
  update(now);
}
function update(now) {
  const ll = new kakao.maps.LatLng(pos.lat, pos.lng);
  meOverlay.setPosition(ll);
  if (!meOverlay.getMap()) meOverlay.setMap(map);
  meEl.firstChild.style.transform = 'rotate(' + lastHeading + 'deg)';
  $('gpsState').textContent = 'GPS ±' + Math.round(pos.acc) + 'm' + (pos.speed != null ? ' · ' + Math.round(pos.speed * 3.6) + 'km/h' : '');
  $('gpsState').style.color = pos.acc <= 30 ? 'var(--dim)' : 'var(--warn)';
  if (touching && now - lastTouch > 8000) touching = 0;   // 떼는 이벤트를 놓친 경우 대비
  if (!gotFirst) { gotFirst = true; map.setCenter(ll); }
  else if (follow && !touching && now - lastTouch > 1500 && now - lastPan > 900) { lastPan = now; map.setCenter(ll); }
  // 안내 중 지도를 옮겨 둔 채 15초간 조작이 없으면 내 위치 따라가기로 복귀
  else if (!follow && navigating && !touching && now - lastTouch > 15000) setFollow(true);
  if (navigating && route) navTick(now);
}

// ---------- 안내 ----------
function navTick(now) {
  const L = N.locate(route, pos, segHint);
  segHint = L.seg;
  if (monitor.update(L.off, pos.acc, now)) { toast('경로를 벗어나 재탐색합니다'); speak('경로를 재탐색합니다'); requestRoute(true); return; }
  const P = N.progress(route, L.along);
  if (P.remainDist < 30 || (!P.next && P.remainDist < 60)) { arrive(); return; }
  renderProgress(P, now);
  if (P.next) {
    const t = announcer.check(P.nextIndex, P.distToNext);
    if (t) {
      const what = P.next.type === 101 ? '목적지에 도착합니다' : P.next.guidance + (/[가-힣]$/.test(P.next.guidance) ? '입니다' : '');
      speak(t === 50 ? '곧 ' + what : N.spokenDist(P.distToNext) + ' 앞 ' + what);
    }
  }
}
function renderProgress(P, now) {
  show('banner', true); show('info', true);
  const ic = N.turnIcon(P.next);
  if ($('turnIcon').dataset.ic !== ic) { $('turnIcon').dataset.ic = ic; $('turnIcon').innerHTML = icon(ic); }
  $('turnDist').textContent = N.formatDist(P.distToNext);
  $('turnText').textContent = P.next ? N.guideText(P.next) : '목적지';
  $('thenText').textContent = P.after ? '이어서 ' + N.guideText(P.after) : '';
  $('remain').textContent = N.formatDist(P.remainDist);
  $('eta').textContent = N.formatEta(now, P.remainTime);
  $('etaDur').textContent = N.formatDur(P.remainTime);
}
function arrive() {
  speak('목적지에 도착했습니다. 안내를 종료합니다');
  toast('목적지에 도착했습니다', 5000);
  stopNav();
}
function stopNav() {
  navigating = false; route = null; dest = null;
  if (routeLine) routeLine.setMap(null);
  if (destMarker) destMarker.setMap(null);
  show('banner', false); show('info', false); show('btnReroute', false); show('btnStop', false);
  try { speechSynthesis.cancel(); } catch (e) {}
}
$('btnStop').onclick = stopNav;
$('btnReroute').onclick = () => requestRoute(true);

function countCall() {
  const today = new Date().toDateString(), c = ls.get('nav.calls', { d: today, n: 0 });
  if (c.d !== today) { c.d = today; c.n = 0; }
  c.n++; ls.set('nav.calls', c); return c.n;
}

async function requestRoute(isReroute) {
  if (!dest) return;
  if (!restKey()) { openSettings(); toast('길찾기를 하려면 카카오 REST API 키를 먼저 저장하세요', 5000); return; }
  if (!pos) { toast('현재 위치를 아직 받지 못했습니다'); return; }
  if (routing) return;
  routing = true;
  const call = async withAngle => {
    const angle = withAngle ? ',angle=' + Math.round(lastHeading) : '';
    const qs = 'origin=' + pos.lng + ',' + pos.lat + angle + '&destination=' + dest.lng + ',' + dest.lat +
               '&priority=RECOMMEND&summary=false&road_details=false';
    countCall();
    const res = await fetch(DIRECTIONS_URL + '?' + qs, { headers: { Authorization: 'KakaoAK ' + restKey() } });
    return { res, body: await res.json().catch(() => ({})) };
  };
  try {
    // 주행 중엔 진행 방향(angle)을 같이 보내 역방향 경로를 줄임. 거부되면 angle 없이 1회 재시도
    const moving = pos.speed != null && pos.speed > 2;
    let { res, body } = await call(moving);
    if (moving && res.status === 400) ({ res, body } = await call(false));
    if (!res.ok) {
      const msg = body.msg || body.message || ('HTTP ' + res.status);
      throw new Error(res.status === 401 || res.status === 403 ? 'REST 키 오류 또는 길찾기 사용 권한 없음: ' + msg : msg);
    }
    setRoute(N.buildRoute(body), isReroute);
  } catch (e) {
    toast('길찾기 실패: ' + e.message, 6000);
  } finally { routing = false; }
}
function setRoute(r, isReroute) {
  route = r; segHint = 0; navigating = true; monitor.reset(); announcer = N.createAnnouncer([500, 200, 50]);
  const path = r.pts.map(p => new kakao.maps.LatLng(p.lat, p.lng));
  if (routeLine) routeLine.setMap(null);
  routeLine = new kakao.maps.Polyline({ path, strokeWeight: 9, strokeColor: '#1a73e8', strokeOpacity: 0.9 });
  routeLine.setMap(map);
  show('btnReroute', true); show('btnStop', true);
  if (!isReroute) {
    const b = new kakao.maps.LatLngBounds(); path.forEach(p => b.extend(p));
    setFollow(false); lastTouch = Date.now(); map.setBounds(b, 80, 80, 160, 80);
    const s = r.summary;
    toast('경로 ' + N.formatDist(s.distance) + ' · ' + N.formatDur(s.duration) + (s.toll ? ' · 통행료 ' + s.toll.toLocaleString() + '원' : ''), 4000);
    speak('경로 안내를 시작합니다');
    setTimeout(() => { if (navigating) { map.setLevel(3); setFollow(true); } }, 4000);
  }
  if (pos) navTick(Date.now());
}

// ---------- 검색 ----------
let places = null;
function openSearch() { show('searchSheet', true); show('settingsSheet', false); renderRecent(); setTimeout(() => $('q').focus(), 50); }
$('btnSearch').onclick = openSearch;
$('searchClose').onclick = () => show('searchSheet', false);
$('searchForm').onsubmit = ev => {
  ev.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  if (!places) places = new kakao.maps.services.Places();
  const opt = pos ? { location: new kakao.maps.LatLng(pos.lat, pos.lng) } : {};
  $('results').innerHTML = '<div class="note">검색 중…</div>';
  places.keywordSearch(q, (data, status) => {
    if (status === kakao.maps.services.Status.ZERO_RESULT) { $('results').innerHTML = '<div class="note">검색 결과가 없습니다</div>'; return; }
    if (status !== kakao.maps.services.Status.OK) { $('results').innerHTML = '<div class="note">검색 오류</div>'; return; }
    renderResults(data.map(d => ({ name: d.place_name, addr: d.road_address_name || d.address_name,
      lat: Number(d.y), lng: Number(d.x), distance: d.distance ? Number(d.distance) : null })));
  }, opt);
};
function itemHtml(r) {
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  return esc(r.name) + '<small>' + esc(r.addr) + (r.distance != null ? ' · ' + N.formatDist(r.distance) : '') + '</small>';
}
function renderResults(list, title) {
  const box = $('results'); box.innerHTML = title ? '<div class="sec">' + title + '</div>' : '';
  list.forEach(r => {
    const b = document.createElement('button'); b.className = 'item'; b.innerHTML = itemHtml(r);
    b.onclick = () => chooseDest(r); box.appendChild(b);
  });
}
function renderRecent() {
  const rec = ls.get('nav.recent', []);
  if ($('q').value.trim() === '') rec.length ? renderResults(rec, '최근 목적지') : ($('results').innerHTML = '<div class="note">최근 목적지가 없습니다</div>');
}
function chooseDest(r) {
  dest = { name: r.name, addr: r.addr, lat: r.lat, lng: r.lng };
  const rec = ls.get('nav.recent', []).filter(x => x.name !== r.name || x.addr !== r.addr);
  rec.unshift(dest); ls.set('nav.recent', rec.slice(0, 5));
  show('searchSheet', false);
  if (destMarker) destMarker.setMap(null);
  destMarker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(r.lat, r.lng) });
  destMarker.setMap(map);
  requestRoute(false);
}
$('clearRecent').onclick = () => { ls.set('nav.recent', []); toast('최근 목적지를 지웠습니다'); };

// ---------- 설정 ----------
function openSettings() {
  show('settingsSheet', true); show('searchSheet', false);
  const k = restKey();
  $('restKey').value = '';
  $('keyState').textContent = k ? '저장된 키: ' + k.slice(0, 4) + '…' + k.slice(-4) : '저장된 키 없음';
  $('evInfo').textContent = 'pointer ' + evCount.pointer + ' / touch ' + evCount.touch + ' / mouse ' + evCount.mouse +
    ' · 터치 지원 ' + (navigator.maxTouchPoints || 0) + '점';
  $('callCount').textContent = ls.get('nav.calls', { n: 0 }).d === new Date().toDateString() ? ls.get('nav.calls').n : 0;
}
$('btnSettings').onclick = openSettings;
$('settingsClose').onclick = () => show('settingsSheet', false);
$('saveKey').onclick = () => {
  const r = N.normalizeKey($('restKey').value);
  if (!r.ok) {
    const bad = r.key.replace(/[0-9a-f]/g, '');
    toast('REST API 키 형식이 아닙니다: ' + r.length + '자 입력됨 (32자 필요)' + (bad ? ', 허용되지 않는 문자 "' + bad.slice(0, 5) + '"' : ''), 7000);
    return;
  }
  ls.set('nav.restKey', r.key); openSettings(); toast('저장했습니다');
};

// ---------- 화면 꺼짐 방지 ----------
async function wake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
wake();

// ---------- 시작 ----------
if (window.__sdkError || !window.kakao || !kakao.maps) {
  toast('카카오 지도를 불러오지 못했습니다. 네트워크 또는 카카오 앱 설정(도메인 등록, 카카오맵 사용 설정)을 확인하세요', 15000);
} else {
  kakao.maps.load(initMap);
}

// 디버그/검증용 (실차 문제 분석 시 콘솔에서 사용)
window.__nav = { N, setRouteFromResponse: resp => setRoute(N.buildRoute(resp), false),
                 feed: (lat, lng, heading = 0, speed = 10) => onPos({ coords: { latitude: lat, longitude: lng, accuracy: 5, heading, speed }, timestamp: 0 }),
                 state: () => ({ pos, follow, navigating, segHint, dest }) };
</script>
</body>
</html>
